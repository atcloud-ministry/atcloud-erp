name: CI

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "23 9 * * *"
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend-fast:
    name: Backend unit + HTTP contracts
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - name: Verify deployment guardrails
        run: node scripts/check-deployment-guardrails.mjs
      - run: npm ci
        working-directory: backend
      - run: npm run lint
        working-directory: backend
      - run: npm run type-check
        working-directory: backend
      - run: npm run build
        working-directory: backend
      - run: npm run test:pr
        working-directory: backend

  frontend-fast:
    name: Frontend unit + production build
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm run lint
        working-directory: frontend
      - run: npm run type-check
        working-directory: frontend
      - run: npm test
        working-directory: frontend
      - run: npm run build
        working-directory: frontend

  critical-db:
    name: Critical and M0 foundation DB flows
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      MONGODB_TEST_URI: mongodb://127.0.0.1:27018/atcloud-signup-test?replicaSet=rs0
      STRIPE_SECRET_KEY: sk_test_placeholder_for_testing
    steps:
      - uses: actions/checkout@v4
      - name: Start MongoDB replica set
        run: docker compose -f docker-compose.test.yml up -d mongodb-replica
      - name: Initialize MongoDB replica set
        run: bash scripts/init-test-replica-set.sh
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
        working-directory: backend
      - run: npm run test:critical
        working-directory: backend
      - run: npm run test:m0-foundation
        working-directory: backend

  browser-e2e:
    name: Critical browser journeys
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npx playwright install --with-deps chromium
        working-directory: frontend
      - run: npm run test:e2e
        working-directory: frontend

  fullstack-e2e:
    name: Real full-stack browser journey
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci --include=dev
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e:fullstack

  full-db:
    name: Full DB integration (main/nightly)
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      MONGODB_TEST_URI: mongodb://127.0.0.1:27018/atcloud-signup-test?replicaSet=rs0
      STRIPE_SECRET_KEY: sk_test_placeholder_for_testing
    steps:
      - uses: actions/checkout@v4
      - name: Start MongoDB replica set
        run: docker compose -f docker-compose.test.yml up -d mongodb-replica
      - name: Initialize MongoDB replica set
        run: bash scripts/init-test-replica-set.sh
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
        working-directory: backend
      - run: npm run test:integration
        working-directory: backend
