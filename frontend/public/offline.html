<!doctype html>
<html lang="en-US">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#111827" />
    <title>You are offline · @Cloud</title>
    <style>
      :root {
        color-scheme: light;
        font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: #f9fafb;
        color: #111827;
      }

      body {
        align-items: center;
        display: flex;
        justify-content: center;
        margin: 0;
        min-height: 100vh;
        padding: 1.5rem;
      }

      main {
        background: #ffffff;
        border: 1px solid #e5e7eb;
        border-radius: 1rem;
        box-shadow: 0 12px 32px rgb(17 24 39 / 10%);
        max-width: 28rem;
        padding: 2rem;
        text-align: center;
      }

      img {
        border-radius: 1rem;
        height: 5rem;
        width: 5rem;
      }

      h1 {
        font-size: 1.5rem;
        margin: 1rem 0 0.5rem;
      }

      p {
        color: #4b5563;
        line-height: 1.6;
        margin: 0 0 1.5rem;
      }

      button {
        background: #2563eb;
        border: 0;
        border-radius: 0.5rem;
        color: #ffffff;
        cursor: pointer;
        font: inherit;
        font-weight: 600;
        padding: 0.75rem 1.25rem;
      }

      button:focus-visible {
        outline: 3px solid #93c5fd;
        outline-offset: 3px;
      }
    </style>
  </head>
  <body>
    <main>
      <img src="/pwa-icon-192.png" alt="@Cloud" width="80" height="80" />
      <h1>You are offline</h1>
      <p>
        @Cloud cannot reach the network right now. Reconnect to see current events,
        directory information, and conversations.
      </p>
      <button type="button" data-offline-retry>Try again</button>
    </main>
    <script src="/offline-retry.js" defer></script>
  </body>
</html>
